name: Codex3N release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的版本标签，例如 v1.6.0"
        required: true
        type: string
      platform:
        description: "需要重新构建的平台"
        default: all
        type: choice
        options:
          - all
          - windows
          - macos

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  verify-release:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-3n.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag belongs to personal branch
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          git fetch origin personal
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/personal

      - name: Verify tag matches Cargo.toml version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION#V}"
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "无法从 Cargo.toml 读出 [workspace.package].version" >&2
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "标签 $TAG 与 Cargo.toml 版本 $MANIFEST_VERSION 不一致；安装包版本来自标签、自更新基准来自 Cargo.toml，请先对齐再发布" >&2
            exit 1
          fi

  verify-tests:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-3n.')
    name: Release test gate
    needs: verify-release
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-verify-tests

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: Check native browser inspector bundle
        run: node scripts/assemble-native-browser-inspector.mjs --check

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: npm dependency audit
        working-directory: apps/codex-plus-manager
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      # codex-plus-manager 里的 tauri::generate_context! 会在编译期检查
      # tauri.conf.json 的 frontendDist（"../dist"）是否存在，缺目录会直接
      # proc macro panic；所以 cargo test 之前必须先产出前端产物。
      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust formatting
        run: cargo fmt --all --check

      # 不在这里跑 `cargo check`：下面的 `cargo test --workspace` 会编译全部目标，
      # check 只是重复（本地按 AGENTS.md 仍保留 check）。
      - name: Relay Clippy gate
        run: cargo clippy -p codex-plus-mobile-relay --all-targets -- -D warnings

      # 预编译二进制；`cargo install` 每次从源码编译 cargo-audit 要 6 分钟，
      # 与代码是否安全无关。
      - name: Install Rust security audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Run Rust dependency audit
        run: cargo audit

      # --no-fail-fast：让所有测试目标都跑完再汇总，避免第一个失败目标掩盖其余结果。
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast

  windows-installer:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-3n.') && (github.event_name == 'release' || inputs.platform != 'macos')
    needs: [verify-release, verify-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-installer

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            # Chocolatey 可能在下载失败后返回成功，必须实际验证编译器。
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $makensis) {
              $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
              if ($command) { $makensis = $command.Source }
            }
            if ($makensis) {
              & $makensis /VERSION
              if ($LASTEXITCODE -eq 0) { break }
            }
            $makensis = $null
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $makensis) { throw "NSIS 安装失败或编译器不可用，停止发布构建。" }

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/

      - name: Build Windows zip asset
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v", "V")
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/Codex3N-$version-windows-x64.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v", "V")
          # NSIS 的 64 位安装目录与 Chocolatey PATH 更新均需要兼容。
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { $makensis = $command.Source }
          }
          if (-not $makensis) {
            throw "NSIS 编译器未找到，检查 Chocolatey 安装结果。"
          }
          Push-Location scripts/installer/windows
          try {
            & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos-dmg:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-3n.') && (github.event_name == 'release' || inputs.platform != 'windows')
    needs: [verify-release, verify-tests]
    name: macOS DMG (universal)
    runs-on: macos-14
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 通用包需要两个架构的 std，构建脚本会各编一遍再 lipo 合并。
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-dmg-universal

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      # 个人仓库沿用 ad-hoc 签名；正式签名与公证由打包脚本按凭据启用。
      - name: Test native macOS update transactions
        run: cargo test -p codex-plus-core --lib update::macos::tests

      - name: Build universal macOS DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#V}"
          # 构建脚本自己编两个架构、lipo 合并、再调 package-dmg.sh 打包。
          bash scripts/installer/macos/build-universal.sh "$VERSION"

      - name: Build macOS zip asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          mkdir -p dist/macos/app-universal
          cp "target/universal/release/codex-plus-plus" "dist/macos/app-universal/"
          cp "target/universal/release/codex-plus-plus-manager" "dist/macos/app-universal/"
          (cd dist/macos && zip -r "Codex3N-${VERSION}-macos-universal.zip" "app-universal")

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            # 真签名时额外校验签名有效性与 Gatekeeper 判定，防止"签了但无效"混过去。
            if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
              codesign --verify --deep --strict "$app"
              spctl --assess --type execute "$app"
            fi
            echo "verified: $app"
          done
          # 打包脚本曾经在 convert 连续失败后仍然退出 0，这里显式确认 DMG 真的存在
          for dmg in dist/macos/*.dmg; do
            test -f "$dmg"
            echo "verified: $dmg"
          done

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/macos/*.dmg
            dist/macos/*.zip

  latest-json:
    if: always() && needs.verify-release.result == 'success' && needs.verify-tests.result == 'success' && (needs.windows-installer.result == 'success' || needs.windows-installer.result == 'skipped') && (needs.macos-dmg.result == 'success' || needs.macos-dmg.result == 'skipped')
    name: Upload static latest.json
    # 单平台补跑时另一个 job 会跳过；成功或跳过才允许更新元数据。
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - verify-tests
      - windows-installer
      - macos-dmg
    steps:
      # 自更新链在客户端是「失败关闭」：latest.json 里没有 sha256、
      # 又拿不到 SHA256SUMS.txt 时，管理器会拒绝安装。所以校验和必须和
      # latest.json 在同一轮里产出，并且只能在产物 job 全部结束后做。
      - name: Generate latest.json and SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          # 下载目录故意不用 `assets`：仓库根就有同名目录，一旦这个 job 以后
          # 加了 checkout，就会把仓库文件当成发布产物算进校验和。
          mkdir -p release-downloads
          # 先整份下载再过滤：gh 的 --pattern 在无匹配文件时会直接退出 1，
          # 而 latest.json / SHA256SUMS.txt 属于上一轮生成物，不能算进校验和。
          gh release download "$TAG" --repo "$REPO" --dir release-downloads --clobber
          rm -f release-downloads/latest.json release-downloads/SHA256SUMS.txt
          ls -l release-downloads
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const DOWNLOAD_DIR = "release-downloads";
          const GENERATED = new Set(["latest.json", "SHA256SUMS.txt"]);

          const sha256File = (file) =>
            new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha256");
              fs.createReadStream(file)
                .on("data", (chunk) => hash.update(chunk))
                .on("error", reject)
                .on("end", () => resolve(hash.digest("hex")));
            });

          const main = async () => {
            const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
            const repo = process.env.REPO;
            const tag = release.tagName || process.env.TAG;
            const version = tag.replace(/^v/i, "");
            const required = [
              `Codex3N-${version}-windows-x64-setup.exe`,
              `Codex3N-${version}-windows-x64.zip`,
              `Codex3N-${version}-macos-universal.dmg`,
            ];
            for (const name of required) {
              if (!(release.assets || []).some((asset) => asset.name === name && asset.size > 0)) {
                throw new Error(`发布附件缺失或为空：${name}`);
              }
            }
            const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;

            const names = fs
              .readdirSync(DOWNLOAD_DIR)
              .filter((name) => !GENERATED.has(name))
              .filter((name) => fs.statSync(path.join(DOWNLOAD_DIR, name)).isFile())
              .sort();
            if (names.length === 0) {
              throw new Error("release 里没有可校验的产物，拒绝生成 latest.json");
            }

            const hashes = new Map();
            for (const name of names) {
              hashes.set(name, await sha256File(path.join(DOWNLOAD_DIR, name)));
            }

            // BSD 风格校验和文件：`<hex>  <文件名>`，两个空格，按文件名排序。
            const sums = names.map((name) => `${hashes.get(name)}  ${name}`).join("\n") + "\n";
            fs.writeFileSync("SHA256SUMS.txt", sums);

            const assets = names.map((name) => ({
              name,
              url: `${baseUrl}/${encodeURIComponent(name)}`,
              sha256: hashes.get(name),
            }));
            const payload = {
              version: `v${version}`,
              url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
              body: release.body || "",
              assets,
            };
            fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          };

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          cat SHA256SUMS.txt
          cat latest.json

      - name: Upload latest.json and SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 同一次上传：latest.json 与它引用的校验和文件必须成对更新。
          gh release upload "$TAG" latest.json SHA256SUMS.txt --clobber --repo "$REPO"
