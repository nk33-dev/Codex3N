name: Codex3N CI artifacts

# 耗时构成（2026-10-07，run 37614229957 的 Windows job，共 27 分钟）：
#   cargo install cargo-audit 6.0、cargo build --release 8.5、cargo test 7.3、
#   cargo check 2.9，其余全部（npm ci/test/tsc、前端构建、NSIS、上传）加起来约 1.5 分钟。
# 因此这里只做三件事：去掉与 test 重复的 check、把 cargo-audit 换成预编译安装、
# 用 rust-cache 复用依赖编译产物；覆盖面（平台、测试、产包）一项不减。

on:
  pull_request:
  push:
    branches: [main, personal]
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的新 push 取消未结束的旧 run，避免过期的红色结果和排队中的旧 run 混在一起。
# personal/main 除外：发布脚本要求标签提交的这次 push run 处于 completed/success，
# 取消会让那个提交永远等不到成功结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/personal' && github.ref != 'refs/heads/main' }}

jobs:
  frontend-platforms:
    name: Frontend tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: Check native browser inspector bundle
        run: node scripts/assemble-native-browser-inspector.mjs --check

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

  # 快速失败面：格式化、编译检查与 clippy。故意不设 needs，产包 job 不等它，
  # 所以它只用来把「编译不过」的反馈从 10 分钟压到 2～3 分钟，不改变总墙钟。
  # 放在 Windows 上跑：与产包 job 同一平台，不会引入未验证的 Linux 编译面。
  rust-lint:
    name: Rust lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint

      - name: Rust formatting
        run: cargo fmt --all --check

      # codex-plus-manager 的 tauri::generate_context! 在编译期要求 tauri.conf.json
      # 的 frontendDist（"../dist"）存在，缺目录会直接 proc macro panic；所以
      # `cargo check` 之前必须先产出前端产物（fmt 不需要，放在前面先跑）。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust check
        run: cargo check --workspace

      - name: Relay Clippy gate
        run: cargo clippy -p codex-plus-mobile-relay --all-targets -- -D warnings

  windows-artifacts:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-artifacts

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: npm dependency audit
        working-directory: apps/codex-plus-manager
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      # 依赖安全审计用预编译二进制；`cargo install` 每次从源码编译 cargo-audit
      # 就要 6 分钟，与代码是否安全无关。
      - name: Rust dependency audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Run Rust dependency audit
        run: cargo audit

      # --no-fail-fast：让所有测试目标都跑完再汇总，避免第一个失败目标掩盖其余结果。
      # 不在这里再跑 `cargo check`：`cargo test` 会编译全部目标，check 只是重复
      # （本地按 AGENTS.md 仍保留 check 这一步）。
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast

      - name: Build release binaries
        run: cargo build --release

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v", "V")
          $version = $version -replace '[\\/]', '-'
          if (-not $version -or $version -in @("main", "personal")) {
            $version = "0.0.0-${{ github.run_number }}"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
          Pop-Location

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: codex3n-windows-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: codex3n-windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  macos-dmg:
    # PR 构建也出通用包，跟发版产物保持一致，避免只在发版时才暴露问题。
    # 没有签名密钥，所以这里走 ad-hoc（脚本的默认行为）。
    name: macOS DMG (universal)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-dmg-universal

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Check native browser inspector bundle
        run: node scripts/assemble-native-browser-inspector.mjs --check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build universal macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "personal" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          # 未设置 MACOS_SIGNING_IDENTITY，脚本自动退回 ad-hoc 签名。
          bash scripts/installer/macos/build-universal.sh "$VERSION"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            echo "verified: $app"
          done
          # 打包脚本曾经在 convert 连续失败后仍然退出 0，这里显式确认 DMG 真的存在
          for dmg in dist/macos/*.dmg; do
            test -f "$dmg"
            echo "verified: $dmg"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: codex3n-macos-universal-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
